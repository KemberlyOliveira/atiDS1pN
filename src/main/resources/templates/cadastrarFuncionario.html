<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Funcionario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h2>Cadastrar Funcionario</h2>


    <form th:action="@{/funcionarioCTR/salvarFuncionario}" method="post" th:object="${funcionario}">

     <input type="hidden" th:field="*{id_funcionario}" />
    
    <label>Nome:</label>
    <input type="text" th:field="*{nome_funcionario}" required><br>

    <label>Cargo:</label>
    <input type="text" th:field="*{cargo_funcionario}" required><br>

    <label>Salário:</label>
    <input type="number" step="0.01" th:field="*{salario_funcionario}" required><br>

    <label>Empresa:</label>
    <select th:field="*{empresaID}" required>
        <option value="">Selecione uma empresa</option>
        <option th:each="emp : ${empresas}"
                th:value="${emp.id_empresa}"
                th:text="${emp.nome_empresa}">
        </option>
    </select>

    <button type="submit">Salvar</button>

    </form>

</body>
</html>
